# Nginx: recibe las visitas de todoherramientas.solvis.com.py y se las pasa a la tienda.
# El HTTPS (candado) lo agrega después Certbot automáticamente en este mismo archivo.
#
# Instalar:  sudo cp /opt/tienda-online/deploy/nginx-tienda.conf /etc/nginx/sites-available/tienda
#            sudo ln -s /etc/nginx/sites-available/tienda /etc/nginx/sites-enabled/tienda
#            sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name todoherramientas.solvis.com.py;

    # Fotos de productos: el panel sube hasta 8 fotos juntas
    client_max_body_size 45m;

    # No mostrar la versión de Nginx
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Las fotos se sirven con caché en el navegador (cada foto nueva tiene otro nombre)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }
}
